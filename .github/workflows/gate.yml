# This repo's own gate: format, lint, types, structural guards, 100% coverage,
# and the build. Everything it runs is a script `npm run ci` also runs locally,
# so a red pipeline is reproducible on a laptop.
name: gate

on: [pull_request]

permissions:
  contents: read

# A push to a pull request makes the run for the commit before it moot, so
# that run is cancelled rather than left to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    # The longest of 26 green runs before the sweep's passes ran side by side
    # took 24.6 minutes (run 35770751392); the two since took 9.4 and 9.9.
    # Without a bound, a browser that stops answering holds a runner for
    # GitHub's default of six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exactly what the lockfile says
        run: npm ci --ignore-scripts

      # The client arrives as a commit rather than as a published build, and it
      # ships its build rather than its sources — so it builds when it is
      # installed, and the hardened install above stops it. This runs that one
      # build, by the commit the manifest pins, and no other package's.
      - name: Build the client this surface is drawn through
        run: npm run client

      # The accessibility sweep drives the built Storybook in a real browser.
      - name: Install the browser the sweep drives
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run the gate
        run: npm run ci
