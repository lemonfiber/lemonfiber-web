# The gates every repo in the org shares, kept in one place so improving one
# improves all of them (Q-R56). Pinned by commit, bumped deliberately.
name: ci

on: [pull_request]

permissions:
  contents: read

jobs:
  spec-check:
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@a32ee06e5b7eb5366a0a50db1ed2b0c5f380303a # main
  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@24892a988c8277f58e14aaa441beae2f234d47aa # main
  security:
    uses: lemonfiber/spec/.github/workflows/security.yml@24892a988c8277f58e14aaa441beae2f234d47aa # main
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@24892a988c8277f58e14aaa441beae2f234d47aa # main
  commitlint:
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@24892a988c8277f58e14aaa441beae2f234d47aa # main
  labeler:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@24892a988c8277f58e14aaa441beae2f234d47aa # main

  # SonarCloud scans this repo by Automatic Analysis, which reports the quality
  # gate and not the zero-new-issues standard. This reads the summary it posts
  # and fails on a counted issue (Q-R64). Named apart from this repo's own
  # `gate`, which is a different check.
  sonar-gate:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/sonar-gate.yml@24892a988c8277f58e14aaa441beae2f234d47aa # main
    with:
      allowed-open: 0
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
