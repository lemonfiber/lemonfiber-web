# The gates every repo in the org shares, kept in one place so improving one
# improves all of them (Q-R56). Pinned by commit, bumped deliberately.
name: ci

on: [pull_request]

permissions:
  contents: read

jobs:
  # `pull-requests: write` is what lets the gate close a pull request whose
  # citation is missing or names an identifier that does not exist, rather than
  # only going red at it. A reusable workflow's permissions block is a request,
  # and a caller granting less than it asks for fails the whole run before any
  # job starts — every required context silent, and nothing to report against.
  # The workflow-level `contents: read` is the default for a job that declares
  # nothing, and a job-level block replaces that default outright, so
  # `contents: read` is restated here rather than inherited.
  spec-check:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/spec-check.yml@d972aee34a685b3d1fa763c9ea9753191ebe87d0 # main
  hygiene:
    uses: lemonfiber/spec/.github/workflows/hygiene.yml@d972aee34a685b3d1fa763c9ea9753191ebe87d0 # main
  security:
    uses: lemonfiber/spec/.github/workflows/security.yml@d972aee34a685b3d1fa763c9ea9753191ebe87d0 # main
  dco:
    uses: lemonfiber/spec/.github/workflows/dco.yml@d972aee34a685b3d1fa763c9ea9753191ebe87d0 # main
  commitlint:
    uses: lemonfiber/spec/.github/workflows/commitlint.yml@d972aee34a685b3d1fa763c9ea9753191ebe87d0 # main
  labeler:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/labeler.yml@d972aee34a685b3d1fa763c9ea9753191ebe87d0 # main

  # SonarCloud scans this repo by Automatic Analysis, which reports the quality
  # gate and not the zero-new-issues standard. This reads the summary it posts
  # and fails on a counted issue (Q-R64). Named apart from this repo's own
  # `gate`, which is a different check.
  sonar-gate:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/sonar-gate.yml@d972aee34a685b3d1fa763c9ea9753191ebe87d0 # main
    with:
      allowed-open: 0
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
