# The gates every repo in the org shares, kept in one place so improving one
# improves all of them (Q-R56). Pinned by commit, bumped deliberately.
name: ci

on: [pull_request]

permissions:
  contents: read

# A pull request pushed again cancels the run on its old head, which nobody
# will read and which holds runners the org shares (Q-R75). Every other event
# is grouped by its own run, so it is never cancelled and never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # SonarCloud scans this repo by Automatic Analysis, which reports the quality
  # gate and not the zero-new-issues standard. This reads the summary it posts
  # and fails on a counted issue (Q-R64). Named apart from this repo's own
  # `gate`, which is a different check.
  sonar-gate:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/sonar-gate.yml@9e4af595a441995073b44629dcac592813f646bf # v1.0.60
    with:
      allowed-open: 0
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
