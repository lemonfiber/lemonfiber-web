# The pinned client is a copy, and a copy goes stale in silence.
#
# This surface reaches lemonfiber through `@lemonfiber/sdk-ts` and through
# nothing else, and it takes that package as an exact git revision rather than
# as a published version. Nothing in the gate looks at that revision: `npm ci`
# installs what the lockfile says and `npm run client` builds what the manifest
# names, and both are content with a revision from any point in the past.
#
# That is not theoretical. The pin once sat at a commit from before four of the
# client's own bugs were fixed, so all four were live here: a stale key read as
# "lemonfiber is not answering", the event stream never handed over an arrival,
# a refusal's own sentence was discarded, and the vendored contract predated a
# kind. One of them was found again here, by hand, hours after it had been fixed
# upstream.
#
# So this compares what the manifest pins against what that repository's main
# is, and names the commits in between. A count would be the wrong thing to
# report: most commits on the client change nothing this surface reaches, and
# "behind by eleven" reads as an emergency where the list reads as a decision.
#
# `Q-R68` requires that comparison to run on pull requests, fail them, and be a
# required status check. It does not, here, yet. That is a decision with a date
# on it rather than an omission, and `Q-R71` is why it is written down:
#
#   Reason      The pin is 21 kinds behind and taking it is not the two-file
#               bump the last two were. `HouseholdMemberRequest.id` became
#               required, and the dashboard snapshot gained a front-door panel
#               and a household panel that the contract itself says belong on
#               the screen. Filling those is a product decision, not a
#               regenerate, so no author of an unrelated pull request could
#               clear this gate.
#   Waits on    https://github.com/lemonfiber/lemonfiber-web/issues/65
#   Reviewed    2026-10-12
#   Turns on    by adding `pull_request:` to the triggers below and adding
#               `sdk-drift` to the required status checks on `main`
#
# Gating before that lands would refuse every pull request in this repository on
# work in flight elsewhere, which is not a gate but a freeze. So this keeps
# reporting in the meantime — and every run says which of the two it is in its
# own summary, because a red X that needs this file read to interpret is the
# thing that let the last one sit for days. Past the review date it says the
# deferral is overdue, since a date nothing reads is the silent omission again
# with a comment around it.
name: sdk-drift
on:
  workflow_dispatch:
  schedule:
    # Weekly, as the contract drift check runs. The client's main is also where
    # `sdk-moved` fires from on every push, so this is the floor rather than the
    # first notice — what it catches is a push that went untold.
    - cron: "40 7 * * 1"

permissions:
  contents: read

jobs:
  sdk-drift:
    name: sdk-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the pinned client with the one its repository serves
        env:
          SDK: https://github.com/lemonfiber/sdk-ts.git
          ISSUE: https://github.com/lemonfiber/lemonfiber-web/issues/65
          REVIEW: "2026-10-12"
        run: |
          set -euo pipefail

          # What the run page shows above the log. The verdict is written there
          # as well as printed, so what this check found and what it is for are
          # read together — the reader who has to be told this is the deferred
          # gate is the one who did not go looking for the workflow file.
          say() {
            printf '%s\n' "$1"
            printf '%s\n' "$1" >>"${GITHUB_STEP_SUMMARY:-/dev/null}"
          }

          # Said on every red run, whichever red it is. The point of the block is
          # that nobody has to open this file to tell an expected failure from a
          # broken check, which is exactly what nobody did last time.
          deferral() {
            say ''
            say '### This is the deferred gate, not a broken check'
            say ''
            say "\`Q-R68\` requires this comparison to gate. It does not here yet, on"
            say "purpose and with a date on it (\`Q-R71\`): the pin is behind by more"
            say 'than a bump, and gating before that is resolved would refuse every'
            say 'pull request in this repository on work in flight elsewhere.'
            say ''
            say "- waits on: ${ISSUE}"
            say "- deferral reviewed: ${REVIEW}"
            say "- turns on by: adding \`pull_request:\` to \`.github/workflows/sdk-drift.yml\`"
            say "  and adding \`sdk-drift\` to the required status checks on \`main\`"
            if [[ "$(date -u +%F)" > "$REVIEW" ]]; then
              say ''
              say "**The deferral is overdue.** It was to be reviewed on ${REVIEW}."
            fi
          }

          # The revision the manifest pins is the one `npm run client` builds,
          # so it is the client this surface is actually drawn through.
          if ! pin=$(python3 - 2>unreadable.txt <<'PY'
          import json
          import pathlib
          import re
          import sys

          NAME = "@lemonfiber/sdk-ts"

          manifest = json.loads(pathlib.Path("package.json").read_text())
          spec = manifest.get("dependencies", {}).get(NAME)

          if spec is None:
              sys.exit(f"{NAME} is not a dependency of this package")

          revision = spec.partition("#")[2]

          if not re.fullmatch("[0-9a-f]{40}", revision):
              sys.exit(f"{NAME} is not pinned to an exact revision: {spec}")

          print(revision)
          PY
          ); then
            say '## The pinned client could not be read'
            say ''
            say 'This did not get as far as comparing anything, so it is not news about'
            say 'sdk-ts either: the manifest does not name the client the way this'
            say 'expects, and what this surface is drawn through is unknown rather than'
            say "behind. Whoever last edited the \`@lemonfiber/sdk-ts\` entry in"
            say "\`package.json\` is who can fix it — it takes \`github:lemonfiber/sdk-ts#\`"
            say 'followed by a full 40-character commit hash.'
            say ''
            say "\`\`\`"
            say "$(cat unreadable.txt)"
            say "\`\`\`"
            deferral
            echo '::error::the pinned client could not be read from package.json — the @lemonfiber/sdk-ts entry must be github:lemonfiber/sdk-ts# followed by a full 40-character commit hash'
            exit 1
          fi

          # Bare and blob-less: this reads the history and none of the files,
          # because a list of commits is the whole of what is being asked for.
          git clone --bare --filter=blob:none --quiet "$SDK" sdk-ts.git

          head=$(git -C sdk-ts.git rev-parse main)

          if ! git -C sdk-ts.git cat-file -e "${pin}^{commit}" 2>/dev/null; then
            say '## The pinned revision is not a commit in sdk-ts'
            say ''
            say 'This is not the lag it usually finds, and it is not news about sdk-ts:'
            say 'the manifest names a revision that repository has no commit for, so'
            say 'what this surface is drawn through is not something anyone else can'
            say 'fetch.'
            say ''
            say "- pinned in \`package.json\`: \`${pin}\`"
            say "- sdk-ts main: \`${head}\`"
            say ''
            say 'To fix it: point the dependency at a revision sdk-ts holds — `'"${head}"'`'
            say "is what main is — and run \`npm install\` so the lockfile moves with it."
            deferral
            echo "::error::the pinned revision is not a commit in sdk-ts — point @lemonfiber/sdk-ts at github:lemonfiber/sdk-ts#${head} in package.json and run npm install"
            exit 1
          fi

          if [ "$pin" = "$head" ]; then
            say '## The pinned client is current'
            say ''
            say "The console is drawn through sdk-ts \`${pin}\`, which is what main is."
            say ''
            say "The \`Q-R68\` gate is still deferred here (see the header of"
            say "\`.github/workflows/sdk-drift.yml\`). A green run is the condition it was"
            say "waiting for: with ${ISSUE} closed, add \`pull_request:\` to this workflow"
            say "and make \`sdk-drift\` a required status check."
            exit 0
          fi

          behind=$(git -C sdk-ts.git log --oneline "${pin}..main")

          # Ahead of main, or on a history main no longer has. Either way the
          # pin is not a point on the line this compares against, and reporting
          # it as current would be a different wrong answer.
          if [ -z "$behind" ]; then
            say '## The pinned revision is not on sdk-ts main'
            say ''
            say 'This is not the lag it usually finds: the pin is a commit sdk-ts holds,'
            say 'but not one main reaches, so it sits ahead of main or on a history main'
            say 'no longer carries. There is no list of commits to take, because the pin'
            say 'is not a point on the line this compares against.'
            say ''
            say "- pinned in \`package.json\`: \`${pin}\`"
            say "- sdk-ts main: \`${head}\`"
            say ''
            say "To fix it: point the dependency at \`${head}\` in \`package.json\` and"
            say "run \`npm install\` so the lockfile moves with it."
            deferral
            echo "::error::the pinned revision is not on sdk-ts main — point @lemonfiber/sdk-ts at github:lemonfiber/sdk-ts#${head} in package.json and run npm install"
            exit 1
          fi

          say '## The pinned client is behind'
          say ''
          say 'sdk-ts has moved on since this surface last took it.'
          say ''
          say "- pinned in \`package.json\`: \`${pin}\`"
          say "- sdk-ts main: \`${head}\`"
          say ''
          say 'The console has not taken these:'
          say ''
          say "\`\`\`"
          say "$behind"
          say "\`\`\`"
          say ''
          say "To catch up: point the dependency at \`${head}\` in \`package.json\`, then"
          say "run \`npm install\` so the lockfile moves with it, and \`npm run client\` to"
          say "rebuild against it. Where that leaves \`npm run types\` red, the catch-up is"
          say "the change ${ISSUE} describes rather than a bump."
          deferral
          echo "::error::the pinned client is behind sdk-ts main — point @lemonfiber/sdk-ts at github:lemonfiber/sdk-ts#${head} in package.json, run npm install, then npm run client"
          exit 1
