# What this repository implements, one row per requirement (OPS-R74).
#
# `done` means the requirement is met in full by what is here, `partial` that this
# repository holds its part and the rest lives elsewhere, `open` that nothing here
# meets it yet. The release gate and the no-stubs gate read this file; a pull
# request that changes whether a requirement is met changes its row.
#
# The rows are the requirements of the web surface itself. A feature this surface
# only draws — setup, checks, updates, the household's administration and the
# rest — is met by the core it asks, and has no row here; what the console offers
# of each is counted in docs/surface-parity.md. A requirement that binds every
# surface (navigation, errors, the dashboard) is partial here, since this is one
# surface of several.

